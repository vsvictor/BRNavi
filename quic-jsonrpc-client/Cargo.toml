[package]
name = "quic-jsonrpc-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
once_cell = "1.20"
quinn = "0.11"
rustls = "0.23"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "signal"] }

[dev-dependencies]
quic-jsonrpc-server = { path = "../quic-jsonrpc-server", version = "0.1.0" }
rcgen = "0.13"
tempfile = "3.23"
