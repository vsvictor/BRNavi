[package]
name = "brnavi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chrono = "0.4"
json-rpc-2-backend = { git = "https://github.com/vsvictor/JSON-RPC-2.git", rev = "e57a725556900decf3275fe8d54158fc077c631a", features = ["message-logging"] }
json-rpc-2-callback = { git = "https://github.com/vsvictor/JSON-RPC-2.git", rev = "e57a725556900decf3275fe8d54158fc077c631a" }
json-rpc-2-oauth2 = { git = "https://github.com/vsvictor/JSON-RPC-2-OAuth2.git", rev = "c4c6bdf48fc60704aacf1809f0085f5813b90a58", default-features = false, features = ["mongodb", "annotations"] }
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
json-rpc-2-oauth2 = { git = "https://github.com/vsvictor/JSON-RPC-2-OAuth2.git", rev = "c4c6bdf48fc60704aacf1809f0085f5813b90a58", default-features = false, features = ["sqlite"] }
pasetors = "0.8"
tempfile = "3"

[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", package = "h3" }
h3-quinn = { git = "https://github.com/hyperium/h3", package = "h3-quinn" }
