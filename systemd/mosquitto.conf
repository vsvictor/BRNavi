user mosquitto
per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/brnavi-passwords

listener 8883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/brnavi-passwords
certfile /run/brnavi-mosquitto/fullchain.pem
keyfile /run/brnavi-mosquitto/key.pem
